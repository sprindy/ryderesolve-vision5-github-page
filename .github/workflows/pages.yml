name: Deploy GitHub Pages frontend
on:
  push:
    branches: [main]
    paths: ['frontend/**', 'scripts/build_pages.py', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare frontend and public backend URL
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: python3 scripts/build_pages.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
